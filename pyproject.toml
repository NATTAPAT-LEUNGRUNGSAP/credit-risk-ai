[project]
name = "credit-risk-ai"
version = "0.1.0"
description = "Leakage-safe credit default modelling on the Home Credit dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "altair==6.2.2",
  "pandas==2.3.3",
  "streamlit==1.63.0",
]

[project.optional-dependencies]
analysis = [
  "duckdb>=1.3,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "llvmlite>=0.43,<0.47",
  "numba>=0.60,<0.64",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "shap>=0.46,<1",
  "tensorflow>=2.18,<3",
  "xgboost>=2.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
